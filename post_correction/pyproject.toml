[project]
name = "asr-post-correction"
version = "0.1.0"
description = "Rubric-guided single- and multi-round ASR transcript correction"
requires-python = ">=3.10"
dependencies = ["openai>=1.0"]

[project.scripts]
asr-correct = "asr_post_correction.cli:main"

[tool.setuptools.packages.find]
include = ["asr_post_correction*"]

