services:
  test:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.13-slim-bookworm}
    image: smart-pipeline:local
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    entrypoint: ["python", "-m", "unittest"]
    command: ["discover", "-s", "tests", "-v"]
    environment:
      JIEBA_CACHE_DIR: /tmp/jieba-cache
    tmpfs:
      - /app/.jieba_cache:mode=1777

  segment-mapping:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.13-slim-bookworm}
    image: smart-pipeline:local
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    volumes:
      - ./runs:/app/runs
      - ./examples:/app/examples:ro
    tmpfs:
      - /app/.jieba_cache:mode=1777
    command:
      - run_segment_mapping.py
      - --input
      - examples/evaluation_input.jsonl
      - --output
      - runs/segment_mapping.jsonl

  evaluation:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.13-slim-bookworm}
    image: smart-pipeline:local
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    profiles: ["api"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runs:/app/runs
      - ./examples:/app/examples:ro
    tmpfs:
      - /app/.jieba_cache:mode=1777
    command:
      - run_evaluation.py
      - --input
      - examples/evaluation_input.jsonl
      - --output-dir
      - runs/evaluation

  post-correction:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.13-slim-bookworm}
    image: smart-pipeline:local
    user: "${PIPELINE_UID:-1000}:${PIPELINE_GID:-1000}"
    profiles: ["api"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runs:/app/runs
      - ./examples:/app/examples:ro
    tmpfs:
      - /app/.jieba_cache:mode=1777
    command:
      - run_post_correction.py
      - --input
      - examples/correction_input.jsonl
      - --output
      - runs/corrected.jsonl
      - --prompt
      - post_correction/prompts/v1_1.json
